; Configuracion de PHP portable para PanPOS (Windows - optimizado para PCs con 4GB RAM)
extension_dir = "ext"
extension=pdo_sqlite
extension=sqlite3
extension=mbstring
extension=openssl
extension=fileinfo
extension=gd
extension=curl
extension=zip

date.timezone = "America/Costa_Rica"
memory_limit = 128M
max_execution_time = 120
post_max_size = 16M
upload_max_filesize = 16M

; Errores solo al log, nunca en la respuesta
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Cache de rutas de archivos (Windows es lento resolviendo rutas)
realpath_cache_size = 2048K
realpath_cache_ttl = 3600

; OPcache: el codigo PHP se compila una sola vez por arranque del servidor.
; Ajustado para 4GB de RAM: Laravel + PanPOS usa ~20-25 MB reales de bytecode.
; JIT desactivado explicitamente para evitar inestabilidad y consumo extra en Windows.
zend_extension = opcache
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=48
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=8000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.enable_file_override=1
opcache.jit=0
opcache.jit_buffer_size=0
