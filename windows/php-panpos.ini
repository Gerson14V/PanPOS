; Configuracion de PHP portable para PanPOS (Windows)
extension_dir = "ext"
extension=pdo_sqlite
extension=sqlite3
extension=mbstring
extension=openssl
extension=fileinfo
extension=gd
extension=curl
extension=zip

date.timezone = "America/Costa_Rica"
memory_limit = 256M
max_execution_time = 120
post_max_size = 32M
upload_max_filesize = 32M

; Errores solo al log, nunca en la respuesta
display_errors = Off
log_errors = On

; Cache de rutas de archivos (Windows es lento resolviendo rutas)
realpath_cache_size = 4096K
realpath_cache_ttl = 3600

; OPcache: el codigo PHP se compila una sola vez por arranque del servidor
; Solo el nombre: PHP lo busca dentro de extension_dir. Con "ext\php_opcache.dll"
; buscaba en ext\ext\ y OPcache nunca se cargaba (cada operacion recompilaba Laravel).
zend_extension = opcache
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.enable_file_override=1
